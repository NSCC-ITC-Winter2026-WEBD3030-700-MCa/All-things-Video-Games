name: all-things-video-games-deployment
 
# Trigger only when a pull request to main is closed
on:
  pull_request:
    types: [closed]
    branches: ["main"]
 
concurrency:
  group: "pages"
  cancel-in-progress: true
 
permissions:
  contents: read
  pages: write
  id-token: write
 
jobs:
  deploy:
    # Only run if the PR was merged by the maintainer
    if: github.event.pull_request.merged == true && github.event.pull_request.merged_by.login == 'INSTRUCTOR_USERNAME'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
 
    steps:
      # Checkout the merged code
      - uses: actions/checkout@v4
 
      # Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
 
      # Install dependencies
      - run: npm ci
 
      # Build the Docusaurus site
      - run: npm run build
 
      # Configure GitHub Pages
      - uses: actions/configure-pages@v5
 
      # Upload the build folder
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build  # Docusaurus default output folder
 
      # Deploy to GitHub Pages
      - id: deployment
        uses: actions/deploy-pages@v4